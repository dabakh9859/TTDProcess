[package]
name = "ttdprocess"
version = "2.5.0"
description = "TTDProcess"
authors = ["ttdprocess"]
edition = "2021"
rust-version = "1.77.2"

# `main.rs` calls `app_lib::run()`, so the library target must keep this name.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["devtools", "dynamic-acl"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-shell = "2.3.5"

serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
tokio = { version = "1.50.0", features = ["full"] }
rayon = "1.11.0"
rand = "0.8.5"

polars = { version = "0.41.3", features = [
    "lazy",
    "csv",
    "parquet",
    "ipc",
    "temporal",
    "zip_with",
    "fmt",
    "dtype-slim",
    "dtype-date",
    "dtype-datetime",
    "dtype-duration",
    "dtype-struct",
] }

calamine = "0.25.0"
rust_xlsxwriter = "0.70.0"

ndarray = { version = "0.15.6", features = ["rayon", "approx"] }
linfa = "0.7.1"
linfa-linear = "0.7.1"
linfa-svm = "0.7.2"
